# Off-by-one country. The boundary cases are where generated code fails, and
# they are exactly the ones a human skims past when reading it.
id: rolling-window
modality: code
prompt: |
  Write a Python function `windows(items, n)` returning a list of every
  contiguous slice of length n, in order. If n is larger than the input, return
  an empty list. If n is less than 1, raise ValueError. Return only the function.
assert:
  checks:
    - "windows([1,2,3,4], 2) == [[1,2],[2,3],[3,4]]"
    - "windows([1,2,3], 3) == [[1,2,3]]"
    - "windows([1,2], 5) == []"
    - "windows([], 1) == []"
    - "len(windows(list(range(10)), 1)) == 10"
    - "raises(windows, [1,2,3], 0, exc=ValueError)"

# The classic, and it is here because the sort step is the one people skip.
# Adjacent-but-not-overlapping is the check that separates a correct answer
# from a plausible one.
id: merge-intervals
modality: code
prompt: |
  Write a Python function `merge(intervals)` taking a list of [start, end]
  pairs and returning them merged and sorted by start. Intervals that merely
  touch (end == next start) DO merge. Return only the function.
assert:
  checks:
    - "merge([[1,3],[2,6],[8,10]]) == [[1,6],[8,10]]"
    - "merge([[1,4],[4,5]]) == [[1,5]]"
    - "merge([[5,6],[1,2]]) == [[1,2],[5,6]]"
    - "merge([]) == []"
    - "merge([[1,10],[2,3]]) == [[1,10]]"

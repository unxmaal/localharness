{{- if .Values.inspect.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "localharness.name" . }}-inspect-{{ .Release.Revision }}
  labels:
    {{- include "localharness.labels" . | nindent 4 }}
    localharness.io/tier: inspect
spec:
  # A RUN, NOT A DEPLOYMENT, and the name says so. A Job's pod template is
  # immutable, so a fixed name makes the second `helm upgrade` that touches it
  # fail -- the chart installs once and then refuses every change. Issue #174.
  ttlSecondsAfterFinished: {{ .Values.jobs.ttlSecondsAfterFinished }}
  # THE FAN-OUT, and the reason this issue targets discovery before lanes.
  # harness/inspect.py imports no model and calls no gateway: it clones source,
  # reads it, and asks the registry for weight sizes. Embarrassingly parallel,
  # and it must never land on the GPU pool -- a pod holding a card to read a
  # README starves the only tier that needs one.
  parallelism: {{ .Values.inspect.parallelism }}
  completions: {{ .Values.inspect.parallelism }}
  # INDEXED, which is what makes the fan-out real. Every pod of a plain Job
  # receives identical arguments, so `parallelism: 4` would be four workers
  # doing the same work: four times the API budget, four times the clones, one
  # result, and four writers racing on the same rows. Indexed gives each pod
  # JOB_COMPLETION_INDEX, which becomes its `--shard i/n`.
  completionMode: Indexed
  backoffLimit: {{ .Values.inspect.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "localharness.labels" . | nindent 8 }}
        localharness.io/tier: inspect
    spec:
      restartPolicy: Never
      containers:
        - name: inspect
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - >-
              exec lh discover --inspect --from-store --json
              --shard "${JOB_COMPLETION_INDEX}/{{ .Values.inspect.parallelism }}"
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            {{- include "localharness.storeEnv" . | nindent 12 }}
            {{- include "localharness.githubEnv" . | nindent 12 }}
            {{- include "localharness.whereEnv" (list . "in-pod") | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.cheap | nindent 12 }}
{{- end }}

{{- if .Values.gpu.enabled }}
{{- if eq .Values.measure.where "host" }}
{{- fail "measure.where=host means a pod holding a lane's identity while `lh` on a machine outside the cluster does the work. The receipt half of that is built and the dispatch half is not, so this would render a pod that measures the pod and labels it the host" }}
{{- end }}
{{- if eq .Values.measure.where "in-pod" }}
{{- fail "measure.where=in-pod beside gpu.enabled says the work runs in a container with no card in view. Pick gpu-node, or turn the GPU off" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "localharness.name" . }}-measure
  labels:
    {{- include "localharness.labels" . | nindent 4 }}
    localharness.io/tier: measure
spec:
  # A QUEUE OF ONE, by the scheduler rather than by hope. `limits.nvidia.com/gpu`
  # on a single-card node IS the lock built in #137: a second pod will not be
  # placed. That lock still earns its keep, because a person running `lh` on the
  # host is invisible to this scheduler.
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "localharness.labels" . | nindent 8 }}
        localharness.io/tier: measure
    spec:
      restartPolicy: Never
      {{- with .Values.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: measure
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--", "python", "-m", "evals.run", "--modality", "image"]
          env:
            {{- include "localharness.storeEnv" . | nindent 12 }}
            {{- include "localharness.whereEnv" (list . .Values.measure.where) | nindent 12 }}
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.gpu.count }}
{{- end }}

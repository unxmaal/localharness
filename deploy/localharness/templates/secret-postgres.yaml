{{- if and .Values.postgres.enabled .Values.postgres.dev.enabled (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "localharness.name" . }}-postgres
  labels:
    {{- include "localharness.labels" . | nindent 4 }}
type: Opaque
stringData:
  # A LAPTOP CONVENIENCE, and the chart refuses to render it beside a GPU
  # profile for exactly this reason. A real cluster sets postgres.existingSecret
  # and this template does not run at all.
  password: {{ .Values.postgres.dev.password | quote }}
{{- end }}

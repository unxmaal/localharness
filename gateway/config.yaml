model_list:
  - model_name: local-small
    litellm_params:
      model: openai/mlx-community/Qwen2.5-0.5B-Instruct-4bit
      api_base: http://127.0.0.1:8081/v1
      api_key: not-needed
  - model_name: local-mid
    litellm_params:
      model: openai/mlx-community/Qwen2.5-1.5B-Instruct-4bit
      api_base: http://127.0.0.1:8081/v1
      api_key: not-needed

  # The largest text model that is comfortable here. Named for its size rather
  # than a role: it was called local-summarize for a voice-layer summarizer that
  # no longer exists, and an alias named after a deleted job is a trap.
  #
  # Size is load-bearing for anything that restates a claim. Qwen2.5-1.5B
  # mangles technical statements when condensing -- "plateaus" came out as
  # "scales superlinearly", the exact opposite of the source.
  - model_name: local-large
    litellm_params:
      model: openai/mlx-community/Qwen2.5-7B-Instruct-4bit
      api_base: http://127.0.0.1:8081/v1
      api_key: not-needed

litellm_settings:
  drop_params: true
  # mlx_lm.server implements /v1/chat/completions but NOT /v1/responses.
  # Without this, LiteLLM routes /v1/messages through its Responses adapter
  # and every Anthropic-shaped request 404s upstream.
  use_chat_completions_url_for_anthropic_messages: true

# What the judge should know when scoring for a machine that runs MLX.
#
# These claims used to sit in novelty.yaml, where they were true of the Mac it
# was written on and wrong anywhere else. Kept as a fragment so the rubric
# itself says only what holds on any machine.
what_scores_high:
  - Native Apple Silicon or MLX. This machine runs MLX, so something that runs
    natively here beats a better result on hardware it does not have.

what_scores_low:
  - Anything that requires CUDA or an NVIDIA card, which this machine does not
    have.

# NOTHING HERE MAY SAY "it runs on this machine", only that running on THIS
# machine beats running on one we do not have. Every candidate the judge sees
# has already been read from its source and found to run here, so bare
# runnability is the price of entry -- it lives in the base rubric's
# scores_nothing_by_itself, and six candidates scored 10/10 the last time it
# was treated as merit.

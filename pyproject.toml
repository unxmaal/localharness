[project]
name = "localharness"
version = "0.1.0"
description = "Local LLM serving + evaluation harness for Apple Silicon"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mlx-lm>=0.31.3",
    "httpx>=0.27",
    "pyyaml>=6",
    "pillow>=10",
    "jiwer>=4.0.0",
    "num2words>=0.5.14",
    "pyobjc-framework-vision>=12.2.2",
    "vtracer>=0.6.15",
]

[project.scripts]
lh = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "evals"]

[dependency-groups]
# Prompt-adherence scoring. A separate group because it is the only torch in an
# otherwise MLX-only repo, and only an image eval needs it:
#   uv run --group metrics python -m evals.run --modality image ...
# 687MB installed on macOS arm64, 36 packages, MPS-capable.
metrics = [
    "torch>=2.4",
    "transformers>=4.44",
    "open_clip_torch>=2.24",
    "resemblyzer>=0.1.4",
    "setuptools>=70,<81",
]

# The multilingual ear. A separate group because mlx-whisper requires torch
# UNCONDITIONALLY -- not as an extra -- which puts 528MB into an otherwise
# MLX-only install for a scoring instrument the CLI never calls. `lh hear` uses
# the audio server; only the eval suite reaches for whisper:
#   uv run --group whisper python -m evals.run --modality stt \
#     --candidates 'stt:mlx-community/whisper-large-v3-mlx,backend=whisper,language=fr'
# harness.audio imports it lazily, so the fast tests pass without this group.
whisper = [
    "mlx-whisper>=0.4.3",
]

dev = [
    "pytest>=8",
    "respx>=0.21",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
mcp = [
    "mcp>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` is deselected by default: these load a 4GB model and take minutes,
# which is not what `make check` is for. `make check-slow` runs them.
# -rs: a silently skipped test reports green for something it never checked.
addopts = "-q --strict-markers -rs -m 'not slow'"
markers = [
    "slow: needs the optional `metrics` group and loads a multi-GB model",
]
# The repo root, so `from evals...` resolves without a sys.path hack in every
# test module.
pythonpath = ["."]

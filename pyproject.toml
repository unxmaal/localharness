[project]
name = "localharness"
version = "0.1.0"
description = "Local LLM serving + evaluation harness for Apple Silicon"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mlx-lm>=0.31.3",
    "httpx>=0.27",
    "pyyaml>=6",
    "pillow>=10",
    "jiwer>=4.0.0",
    "num2words>=0.5.14",
]

[project.scripts]
lh = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "evals"]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# The repo root, so `from evals...` resolves without a sys.path hack in every
# test module.
pythonpath = ["."]
